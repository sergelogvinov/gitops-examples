---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-cloudflare
spec:
  interval: 60h
  timeout: 30m

  maxHistory: 2
  driftDetection:
    mode: enabled

  chart:
    spec:
      chart: cloudflare-tunnel
      version: 0.1.1
      sourceRef:
        kind: HelmRepository
        name: sergelogvinov
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3

  valuesFrom:
    - kind: ConfigMap
      name: ingress-cloudflare-helm-values
      optional: true
    - kind: Secret
      name: ingress-cloudflare-helm-values

  values:
    fullnameOverride: cloudflare-tunnel

    args:
      - run
