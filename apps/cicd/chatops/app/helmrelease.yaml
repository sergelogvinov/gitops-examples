---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: chatops
spec:
  interval: 60m
  timeout: 30m

  maxHistory: 2
  driftDetection:
    mode: enabled

  chart:
    spec:
      chart: gh-chatops
      version: 0.0.4
      sourceRef:
        kind: HelmRepository
        name: mybuild-dev
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3

  valuesFrom:
    - kind: ConfigMap
      name: chatops-helm-values
      optional: true
    - kind: Secret
      name: chatops-helm-values

  values:
    fullnameOverride: gh-chatops

    podAntiAffinityPreset: soft
    podAntiAffinityPresetKey: kubernetes.io/hostname

    nodeSelector:
      node-role.kubernetes.io/web: ""
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        effect: NoSchedule
