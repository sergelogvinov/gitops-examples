---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: chatops
  namespace: flux-system
spec:
  targetNamespace: cicd
  path: ./apps/cicd/chatops/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: gitops-clusters
  wait: false
  interval: 60m
  retryInterval: 5m
